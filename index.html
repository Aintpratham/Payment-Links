<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Payment Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.06);
      --accent: #d4b84a;
      --accent-glow: rgba(212, 184, 74, 0.22);
      --text: #e5e5e5;
      --text-muted: #737373;
      --copy-border: rgba(212, 184, 74, 0.55);
      --copy-bg-hover: rgba(212, 184, 74, 0.12);
      --copied: rgba(74, 124, 89, 0.25);
      --copied-border: rgba(74, 124, 89, 0.5);
      --radius: 14px;
      --radius-btn: 999px;
      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }

    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      background-image: radial-gradient(ellipse 120% 80% at 50% 0%, rgba(255, 255, 255, 0.02), transparent 50%);
      color: var(--text);
      padding: calc(1.75rem + var(--safe-top)) 1rem calc(2rem + var(--safe-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    .wrap { max-width: 420px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-size: clamp(1.5rem, 5vw, 1.85rem);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .list { display: flex; flex-direction: column; gap: 0.6rem; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      opacity: 0;
      transform: translateY(12px);
      animation: cardIn 0.45s ease forwards;
      transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .price { font-weight: 600; font-size: clamp(1rem, 2.5vw, 1.15rem); white-space: nowrap; }
    .price span { color: var(--text-muted); font-weight: 500; font-size: 0.82em; }

    .actions { display: flex; gap: 0.5rem; }

    .btn {
      --touch: 44px;
      min-height: var(--touch);
      padding: 0.55rem 1.1rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-btn);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s, color 0.2s;
    }

    .btn-copy {
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--copy-border);
    }

    .btn-open {
      color: #0a0a0a;
      background: var(--accent);
      border: 1px solid var(--accent);
    }

    @media (hover: hover) {
      .btn-copy:hover {
        background: var(--copy-bg-hover);
        border-color: var(--accent);
        box-shadow: 0 0 16px var(--accent-glow);
      }
      .btn-open:hover {
        box-shadow: 0 0 20px var(--accent-glow);
        transform: translateY(-1px);
      }
      .row:hover {
        background: var(--bg-card-hover);
        border-color: rgba(255, 255, 255, 0.12);
      }
    }

    .btn:active { transform: scale(0.96); }

    .btn-copy.copied {
      color: #7cb88a;
      border-color: var(--copied-border);
      background: var(--copied);
    }

    /* Desktop grid */
    @media (min-width: 768px) {
      body { padding: 2.5rem 2rem calc(2.5rem + var(--safe-bottom)); }
      .wrap { max-width: 980px; }
      header { margin-bottom: 2.75rem; }
      h1 { font-size: 2rem; letter-spacing: -0.03em; }
      h1::after {
        content: '';
        display: block;
        width: 3rem;
        height: 3px;
        margin: 0.85rem auto 0;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        border-radius: 2px;
        opacity: 0.8;
      }
      .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      .row {
        flex-direction: column;
        align-items: stretch;
        gap: 1.1rem;
        text-align: center;
        padding: 1.35rem;
        border-radius: 16px;
      }
      .price { font-size: 1.25rem; }
      .price span { display: block; margin-top: 0.15rem; }
      .actions { gap: 0.6rem; }
      .btn { flex: 1; padding: 0.65rem 1rem; }
      @media (hover: hover) {
        .row:hover {
          transform: translateY(-4px);
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
      }
    }

    @media (min-width: 1100px) {
      .list { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }
    }

    .row:nth-child(1)  { animation-delay: 0.04s; }
    .row:nth-child(2)  { animation-delay: 0.08s; }
    .row:nth-child(3)  { animation-delay: 0.12s; }
    .row:nth-child(4)  { animation-delay: 0.16s; }
    .row:nth-child(5)  { animation-delay: 0.20s; }
    .row:nth-child(6)  { animation-delay: 0.24s; }
    .row:nth-child(7)  { animation-delay: 0.28s; }
    .row:nth-child(8)  { animation-delay: 0.32s; }
    .row:nth-child(9)  { animation-delay: 0.36s; }
    .row:nth-child(10) { animation-delay: 0.40s; }
    .row:nth-child(11) { animation-delay: 0.44s; }

    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; transform: none; }
      .btn, .row { transition: none; }
    }

    .toast {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      right: max(1rem, env(safe-area-inset-right));
      bottom: calc(1.25rem + var(--safe-bottom));
      margin: 0 auto;
      max-width: 320px;
      padding: 0.75rem 1rem;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Payment Links</h1>
    </header>
    <div class="list" id="list"></div>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    // Single source of truth. Add or remove an amount here and the card appears or disappears.
    const PAYMENT_LINKS = {
      100:  'https://buy.stripe.com/00w00j3HUeXB68y5ch1sQ08',
      200:  'https://buy.stripe.com/fZu28r2DQ8zd54u6gl1sQ07',
      300:  'https://buy.stripe.com/dRmeVdemy3eT9kKfQV1sQ04',
      400:  'https://buy.stripe.com/00waEXemy3eTbsS8ot1sQ06',
      499:  'https://buy.stripe.com/28EdR9ceqeXB68yawB1sQ00',
      600:  'https://buy.stripe.com/fZu8wPguG3eT1SicEJ1sQ0b',
      700:  'https://buy.stripe.com/8x214ndiu7v9eF4cEJ1sQ09',
      800:  'https://buy.stripe.com/eVq9ATfqC5n12Wm0W11sQ01',
      900:  'https://buy.stripe.com/7sYcN5fqC7v97cCbAF1sQ0c',
      999:  'https://buy.stripe.com/aFaaEX0vI3eT0OeawB1sQ05',
      1500: 'https://buy.stripe.com/6oU14n3HU02H54u3491sQ0a',
    };

    const list = document.getElementById('list');
    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toast.tid);
      toast.tid = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        showToast('Copied to clipboard');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1600);
      }).catch(() => {
        btn.textContent = 'Failed';
        showToast('Copy failed. Long-press the Open button to copy the link.');
        setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
      });
    }

    // Build cards straight from the links object, sorted by amount.
    Object.keys(PAYMENT_LINKS)
      .map(Number)
      .sort((a, b) => a - b)
      .forEach(amount => {
        const url = PAYMENT_LINKS[amount];
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <span class="price">CAD ${amount.toLocaleString()}<span> / payment</span></span>
          <div class="actions">
            <button type="button" class="btn btn-copy">Copy</button>
            <a class="btn btn-open" href="${url}" target="_blank" rel="noopener">Open</a>
          </div>
        `;
        row.querySelector('.btn-copy')
          .addEventListener('click', e => copyLink(url, e.currentTarget));
        list.appendChild(row);
      });
  </script>
</body>
</html>
